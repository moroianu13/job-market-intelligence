# Kubernetes Deployment for Job Market Intelligence

apiVersion: v1
kind: Namespace
metadata:
  name: job-intelligence

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: job-intelligence
data:
  LOG_LEVEL: "INFO"
  PYTHONUNBUFFERED: "1"

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: job-intelligence
type: Opaque
stringData:
  ADZUNA_APP_ID: "your_app_id_here"
  ADZUNA_APP_KEY: "your_app_key_here"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: job-intelligence
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-ui
  namespace: job-intelligence
  labels:
    app: streamlit-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: streamlit-ui
  template:
    metadata:
      labels:
        app: streamlit-ui
    spec:
      containers:
      - name: streamlit
        image: your-registry/job-market-intelligence:latest
        ports:
        - containerPort: 8501
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: models
          mountPath: /app/models
        - name: reports
          mountPath: /app/reports
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 5
          periodSeconds: 5
        command: ["streamlit", "run", "app/streamlit_app.py", "--server.address", "0.0.0.0"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data-pvc
      - name: models
        persistentVolumeClaim:
          claimName: data-pvc
      - name: reports
        persistentVolumeClaim:
          claimName: data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-service
  namespace: job-intelligence
spec:
  selector:
    app: streamlit-ui
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8501
  type: LoadBalancer

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline-scheduler
  namespace: job-intelligence
spec:
  schedule: "0 2 * * 1"  # Every Monday at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: pipeline
            image: your-registry/job-market-intelligence:latest
            envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
            volumeMounts:
            - name: data
              mountPath: /app/data
            - name: models
              mountPath: /app/models
            - name: reports
              mountPath: /app/reports
            command: ["python", "orchestration/run_pipeline.py", "--all", "--ml", "--ghost-detection"]
            resources:
              requests:
                memory: "2Gi"
                cpu: "1000m"
              limits:
                memory: "4Gi"
                cpu: "2000m"
          restartPolicy: OnFailure
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data-pvc
          - name: models
            persistentVolumeClaim:
              claimName: data-pvc
          - name: reports
            persistentVolumeClaim:
              claimName: data-pvc
      backoffLimit: 3
