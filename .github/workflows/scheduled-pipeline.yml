name: Scheduled Data Pipeline

on:
  schedule:
    # Run every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  run-pipeline:
    name: Execute Data Pipeline
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create .env file
      run: |
        echo "ADZUNA_APP_ID=${{ secrets.ADZUNA_APP_ID }}" >> .env
        echo "ADZUNA_APP_KEY=${{ secrets.ADZUNA_APP_KEY }}" >> .env
        
    - name: Run full pipeline with ghost detection
      run: |
        python orchestration/run_pipeline.py --all --ml --ghost-detection

    - name: Remove .env
      if: always()
      run: rm -f .env
        
    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pipeline-summaries
        path: |
          reports/eda/**/EDA_REPORT.md
          reports/insights/**/INSIGHTS.md
          reports/ghost_jobs/**/summary.json
        retention-days: 3
        
    - name: Generate pipeline summary
      run: |
        echo "## 📊 Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Date**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "**Status**: ✅ Completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "reports/ghost_jobs/$(date +%Y-%m-%d)/summary.json" ]; then
          echo "### Ghost Jobs Detected" >> $GITHUB_STEP_SUMMARY
          cat reports/ghost_jobs/$(date +%Y-%m-%d)/summary.json | jq -r '"- Total unique jobs: \(.total_unique_jobs)\n- Ghost jobs: \(.ghost_jobs_count) (\(.ghost_jobs_pct)%)"' >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Notify on failure
      if: failure()
      uses: actions/github-script@00f12e3e20659f42342b1c0226afda7f7c042325
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🚨 Pipeline Failure - ' + new Date().toISOString().split('T')[0],
            body: 'The scheduled data pipeline failed. Please check the logs.',
            labels: ['pipeline', 'automated', 'bug']
          })
