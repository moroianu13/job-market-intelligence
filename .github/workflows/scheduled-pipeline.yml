name: Scheduled Data Pipeline

permissions:
  contents: write  # Required for creating issues on failure
  issues: write    # Required for creating issues on failure

on:
  schedule:
    # Run every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  run-pipeline:
    name: Execute Data Pipeline
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      
    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create .env file
      run: |
        echo "ADZUNA_APP_ID=${{ secrets.ADZUNA_APP_ID }}" >> .env
        echo "ADZUNA_APP_KEY=${{ secrets.ADZUNA_APP_KEY }}" >> .env
        
    - name: Run full pipeline with ghost detection
      run: |
        python -m orchestration.run_pipeline --all --ml --ghost-detection

    - name: Remove .env
      if: always()
      run: rm -f .env
        
    - name: Upload ML models and reports
      if: success()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ml-models-${{ github.run_id }}
        path: |
          models/role_classifier/**/role_classifier.joblib
          models/role_classifier/**/vectorizer.joblib
          models/role_classifier/**/metadata.txt
          models/salary/**/salary_model.joblib
          models/salary/**/metrics*.json
          models/salary/**/metrics*.csv
        retention-days: 90
        
    - name: Upload pipeline reports
      if: success()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pipeline-reports-${{ github.run_id }}
        path: |
          reports/eda/**/REPORT.md
          reports/eda/**/snapshot.json
          reports/insights/**/SUMMARY.txt
          reports/insights/**/tables/*.csv
        retention-days: 30
        
    - name: Generate pipeline summary
      if: success()
      run: |
        echo "## 📊 Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Date**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "**Status**: ✅ Completed" >> $GITHUB_STEP_SUMMARY
        echo "**Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🤖 ML Models Trained" >> $GITHUB_STEP_SUMMARY
        echo "- Role Classifier: \`models/role_classifier/$(date +%Y-%m-%d)/\`" >> $GITHUB_STEP_SUMMARY
        echo "- Salary Model: \`models/salary/$(date +%Y-%m-%d)/\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- ML Models (90 days): \`ml-models-${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Reports (30 days): \`pipeline-reports-${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
        
    - name: Notify on failure
      if: failure()
      uses: actions/github-script@00f12e3e20659f42342b1c0226afda7f7c042325
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🚨 Pipeline Failure - ' + new Date().toISOString().split('T')[0],
            body: 'The scheduled data pipeline failed. Please check the logs.',
            labels: ['pipeline', 'automated', 'bug']
          })
